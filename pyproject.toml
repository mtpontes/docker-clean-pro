[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docker-clean-pro"
version = "1.0.0"
description = "Professional Docker cleanup tool migrated from PowerShell to Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "mtpontes" }
]
dependencies = [
    "typer",
    "rich",
    "docker",
    "psutil",
]

[project.urls]
Repository = "https://github.com/mtpontes/docker-clean-pro"
Documentation = "https://mtpontes.github.io/docker-clean-pro/"
"Bug Tracker" = "https://github.com/mtpontes/docker-clean-pro/issues"

[project.scripts]
docker-clean = "src.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
    "PyYAML",
    "build",
]

[tool.hatch.envs.default.scripts]
docs-serve = [
  "npm run dev --prefix docs-site"
]
docs-build = [
  "npm run build --prefix docs-site"
]
build-local = [
  "python -m build"
]
clean = [
  "rm -rf dist/",
  "rm -rf *.egg-info"
]
run = "python src/main.py {args}"

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
cov = "pytest --cov=src --cov-report=term-missing {args:tests}"
