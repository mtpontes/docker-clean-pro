name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for Trusted Publishing
      contents: write  # Required for tagging/commits if needed

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Extract version
      id: extract_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        else
          # Try to extract version from commit message (e.g. "release/1.2.3" or "v1.2.3")
          MSG=$(git log -1 --pretty=%B)
          if [[ $MSG =~ release/([v0-9.]+) ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          elif [[ $MSG =~ v([0-9.]+) ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "No version pattern found in commit message. Skipping publish."
            echo "SKIP=true" >> $GITHUB_ENV
          fi
        fi

    - name: Update version in pyproject.toml
      if: env.SKIP != 'true'
      run: |
        python scripts/update_version.py ${{ env.VERSION }}

    - name: Build binary wheel and source tarball
      if: env.SKIP != 'true'
      run: python -m build

    - name: Publish package distributions to PyPI
      if: env.SKIP != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        # Trusted publishing doesn't need API tokens
